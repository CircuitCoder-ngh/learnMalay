name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/malay-learning-site-wuhz95]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and rebuild both word lists
        run: |
          node tools/check-ms.mjs content/ms/words-*.tsv
          node tools/check-en.mjs content/en/words-*.tsv
          node tools/build-ms.mjs
          node tools/build-en.mjs
          git diff --exit-code js/data
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html icon.svg css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
